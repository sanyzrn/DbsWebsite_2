name: Idea encryption public key

# Publish only the public half of a deterministic sealed-box key so scheduled
# ChatGPT tasks can encrypt ideas without being given a private server secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Derive non-sensitive sealed-box public key
        env:
          IDEA_SHARED_SECRET: ${{ secrets.BALE_BOT_TOKEN }}
        run: |
          if [ "${#IDEA_SHARED_SECRET}" -lt 15 ]; then
            echo "::error::Required Actions secret is missing"
            exit 1
          fi
          php -r '
          $seed=hash_hkdf("sha256", getenv("IDEA_SHARED_SECRET"), SODIUM_CRYPTO_BOX_SEEDBYTES, "dbsstudio.idea.sealed-box.v1");
          $pair=sodium_crypto_box_seed_keypair($seed);
          sodium_memzero($seed);
          $public=sodium_crypto_box_publickey($pair);
          sodium_memzero($pair);
          file_put_contents("public/idea/public-key.json", json_encode([
            "version"=>"DBS-IDEA-V1",
            "algorithm"=>"crypto_box_seal",
            "public_key_base64"=>base64_encode($public)
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)."\n");
          '
      - name: Update public key in cursor-dev only (never mutate production main)
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = 'public/idea/public-key.json';
            const next = fs.readFileSync(path, 'utf8');
            const owner = context.repo.owner, repo = context.repo.repo;
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({owner, repo, path, ref: 'cursor-dev'});
              if (!Array.isArray(data)) {
                sha = data.sha;
                if (Buffer.from(data.content, 'base64').toString('utf8') === next) {
                  core.info('Public key is already current in cursor-dev');
                  return;
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'cursor-dev', sha,
              content: Buffer.from(next).toString('base64'),
              message: 'chore(idea): refresh public encryption key [skip ci]',
            });
            core.info('Updated the public encryption key on cursor-dev');
