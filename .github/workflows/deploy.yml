# Deploys dist/ to the dbsstudio.ir Apache FTPS host after CI succeeds on main.
# Vercel remains connected as a safety-net preview until FTP is confirmed end-to-end.
name: Deploy to hosting

on:
  workflow_run:
    workflows: ["CI", "Refresh Nex production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
concurrency:
  group: dbsstudio-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push') ||
       (github.event.workflow_run.name == 'Refresh Nex production' && contains(fromJSON('["schedule","workflow_dispatch","repository_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit CI validated, not whatever tip main has now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Download only the artifact from the successful verification run
        uses: actions/download-artifact@v8
        with:
          name: verified-site
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check artifact provenance and production freshness
        id: promotion
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-promotion.mjs >> "$GITHUB_OUTPUT"

      # Refuse to publish URLs for the previous domain.
      - name: Verify production origin
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ "${SITE_URL%/}" != "https://dbsstudio.ir" ]; then
            echo "::error::SITE_URL must be https://dbsstudio.ir before deploying."
            exit 1
          fi

      - name: Generate Bale config
        if: steps.promotion.outputs.deploy == 'true'
        run: |
          mkdir -p dist/api
          printf '%s\n' \
            '<?php' \
            "define('BALE_BOT_TOKEN', '${{ secrets.BALE_BOT_TOKEN }}');" \
            "define('BALE_CHAT_ID', '${{ secrets.BALE_CHAT_ID }}');" \
            > dist/api/bale-config.php
          test -f dist/api/contact.php
          test -f dist/api/issue.php
          test -f dist/api/bale-config.php
          php -l dist/api/contact.php
          php -l dist/api/issue.php
          php -l dist/api/bale-config.php

      # Hidden Apache configuration must come from the verified artifact itself.
      - name: Verify artifact Apache rules
        run: |
          test -f dist/.htaccess
          test -f dist/en/.htaccess
          grep -q 'ErrorDocument 404 /en/404.html' dist/en/.htaccess
          grep -q 'ErrorDocument 404 /404.html' dist/.htaccess
          if grep -E '<If |<Else>' dist/.htaccess dist/en/.htaccess; then
            echo "ERROR: locale ErrorDocument must not use <If>/<Else>"
            exit 1
          fi

      - name: Deploy via FTP
        if: steps.promotion.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (explicit TLS) is required — plain FTP is not acceptable.
          protocol: ftps
          local-dir: ./dist/
          # Confirm this FTP login opens the dbsstudio.ir document root before first deploy.
          server-dir: ./
          # Separate sync history from other sites sharing the host.
          state-name: .dbswebsite-2-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
