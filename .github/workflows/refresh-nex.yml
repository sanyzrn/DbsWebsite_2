name: Refresh Nex snapshot

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [nex-release-published]

concurrency:
  group: refresh-nex-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor-dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Refresh public releases and product source
        run: npm run fetch:nex && npm run generate:nex
        env:
          NEX_SOURCE_TOKEN: ${{ secrets.NEX_SOURCE_TOKEN }}
      - name: Detect snapshot changes
        id: changes
        shell: bash
        run: |
          git add content/nex public/images/nex/guide public/nex public/en/nex public/images/nex/share
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate snapshot with a production build
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck && npm run build
        env:
          NEX_DATA_OFFLINE: "1"
      - name: Commit refreshed snapshot to the permanent development branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nex): refresh published product snapshot"
          git push origin HEAD:cursor-dev
